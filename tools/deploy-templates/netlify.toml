[build]
  publish = "."
  command = ""

# 静态资源长缓存：文件名带版本时才可 immutable，这里只给 vendor/ 下的固定库加长缓存
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
